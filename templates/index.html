<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CultureSync — The AI Campus Slang Game Arena | Team 14</title>
  <meta name="description" content="AI Gamified Campus Slang & Cultural Literacy Engine with 2D Dino Runner, Skin Wardrobe Shop, and Groq AI Ingestion for International Student Teams." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- React 18 + ReactDOM + Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #070a12;
      --bg-card: rgba(15, 23, 42, 0.88);
      --bg-card-hover: rgba(30, 41, 59, 0.95);
      --border: rgba(255, 255, 255, 0.12);
      --border-glow: rgba(99, 102, 241, 0.4);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      --accent: #10b981;
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --fire: #f59e0b;
      --fire-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --cyan: #38bdf8;
      --cyan-gradient: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --font-arcade: 'Orbitron', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(245, 158, 11, 0.14) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.16) 0px, transparent 60%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation & Real-time Wallet Bar */
    .top-nav {
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      background: rgba(7, 10, 18, 0.85);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 18px rgba(99, 102, 241, 0.5);
    }

    .brand-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .brand-text {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: #94a3b8;
      font-family: var(--font-mono);
    }

    /* Player Real-Time Wallet Pills */
    .wallet-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .wallet-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      font-family: var(--font-arcade);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .wallet-pill.gold {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.12);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.25);
    }

    .wallet-pill.diamond {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.12);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
      animation: pulseDiamond 2s infinite ease-in-out;
    }

    @keyframes pulseDiamond {
      0%, 100% { box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }
      50% { box-shadow: 0 0 18px rgba(56, 189, 248, 0.7); }
    }

    .wallet-pill.fire {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.1);
    }

    .wallet-pill.xp {
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.1);
    }

    /* Main Tab Navigation Bar */
    .tab-bar-container {
      display: flex;
      justify-content: center;
      margin: 20px auto 0;
      padding: 0 16px;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      padding: 6px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.45);
    }

    .tab-btn.shop-tab.active {
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.45);
    }

    .container {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px;
      flex: 1;
    }

    /* ================================================================= */
    /* 1. DINO ARCADE CABINET */
    /* ================================================================= */
    .dino-arcade-container {
      background: linear-gradient(180deg, #0d1322 0%, #080c16 100%);
      border: 2px solid rgba(99, 102, 241, 0.5);
      border-radius: 24px;
      padding: 0;
      box-shadow: 0 0 50px rgba(99, 102, 241, 0.35), 0 25px 70px rgba(0, 0, 0, 0.85);
      max-width: 880px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .arcade-marquee {
      background: linear-gradient(90deg, #090e1a 0%, #171c33 50%, #090e1a 100%);
      border-bottom: 2px solid rgba(56, 189, 248, 0.35);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-arcade);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .marquee-leds {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .led-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .led-dot.green {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseGreen 1.5s infinite;
    }

    .led-dot.red {
      background: #f43f5e;
      box-shadow: 0 0 10px #f43f5e;
      animation: pulseRed 2s infinite;
    }

    .led-dot.gold {
      background: #fbbf24;
      box-shadow: 0 0 10px #fbbf24;
    }

    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    @keyframes pulseRed {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .arcade-body {
      padding: 20px 24px 24px;
    }

    .dino-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hud-pill {
      font-family: var(--font-arcade);
      font-size: 0.85rem;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 10px;
      background: rgba(10, 15, 29, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .stage-pill {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.1);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .score-pill {
      color: #f1f5f9;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .gold-pill {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.1);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .diamond-pill {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.15);
    }

    .hud-btn-audio {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      color: #cbd5e1;
      padding: 8px 14px;
      font-family: var(--font-heading);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hud-btn-audio:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    /* Active Skin Badge on HUD */
    .equipped-skin-badge {
      font-family: var(--font-heading);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.4);
      color: #f472b6;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .equipped-skin-badge:hover {
      background: rgba(236, 72, 153, 0.25);
      border-color: #ec4899;
    }

    /* Canvas Wrapper with CRT Scanline Effect */
    .dino-canvas-wrapper {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid #1e293b;
      background: #070d19;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(0, 0, 0, 0.85);
    }

    .dino-canvas-wrapper::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
      background-size: 100% 4px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.55;
    }

    #dinoCanvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 380px;
      cursor: pointer;
    }

    /* Controls Bar & Tactile Arcade Pushbuttons */
    .dino-controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .control-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .key-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-bottom: 3px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      padding: 3px 8px;
      font-family: var(--font-arcade);
      font-size: 0.78rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .control-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-dino-jump {
      background: linear-gradient(180deg, #10b981 0%, #059669 60%, #047857 100%);
      border: none;
      border-bottom: 5px solid #064e3b;
      border-radius: 14px;
      padding: 13px 32px;
      font-family: var(--font-arcade);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transition: all 0.08s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-dino-jump:active {
      transform: translateY(4px);
      border-bottom-width: 1px;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.6);
    }

    .btn-dino-restart {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-bottom: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      padding: 13px 20px;
      color: #cbd5e1;
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn-dino-restart:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .btn-dino-restart:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }

    /* Leaderboard Ticker */
    .arcade-ticker {
      margin-top: 18px;
      background: #090e1a;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #94a3b8;
      overflow: hidden;
    }

    .ticker-tag {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      white-space: nowrap;
    }

    .ticker-content {
      white-space: nowrap;
      animation: tickerScroll 22s linear infinite;
    }

    @keyframes tickerScroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* ================================================================= */
    /* 2. DINO SKIN SHOP (WARDROBE & CUSTOMIZATION) */
    /* ================================================================= */
    .skin-shop-wrapper {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .shop-hero-card {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
    }

    .shop-hero-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shop-hero-desc {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-top: 6px;
      max-width: 580px;
      line-height: 1.5;
    }

    .shop-earn-callout {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shop-earn-callout .earn-txt {
      font-size: 0.88rem;
      color: #fbbf24;
      font-weight: 700;
    }

    /* Shop Main Layout: Left Preview Stage + Right Catalog Grid */
    .shop-main-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .shop-main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Left: Live 3D/Canvas Preview Chamber */
    .preview-chamber {
      background: linear-gradient(180deg, #0d1424 0%, #090e1a 100%);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      position: sticky;
      top: 90px;
    }

    .preview-stage-wrap {
      position: relative;
      margin: 0 auto 16px;
      width: 240px;
      height: 220px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    #skinPreviewCanvas {
      display: block;
      width: 240px;
      height: 220px;
    }

    .preview-rarity-pill {
      font-family: var(--font-arcade);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      display: inline-block;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .preview-skin-name {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .preview-skin-tagline {
      font-size: 0.85rem;
      color: var(--cyan);
      font-style: italic;
      margin-bottom: 12px;
    }

    .preview-skin-desc {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 14px;
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 12px;
      border-radius: 8px;
    }

    .preview-perk-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #34d399;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: left;
    }

    .btn-skin-action {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-family: var(--font-arcade);
      font-size: 0.92rem;
      font-weight: 900;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-skin-action.equipped {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #34d399;
      cursor: default;
    }

    .btn-skin-action.equip {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.45);
    }

    .btn-skin-action.equip:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(56, 189, 248, 0.6);
    }

    .btn-skin-action.buy {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45);
    }

    .btn-skin-action.buy:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.6);
    }

    /* Right: Skins Grid */
    .skins-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .skin-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .skin-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .skin-card.selected {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      background: rgba(26, 36, 61, 0.95);
    }

    .skin-card.active-equipped {
      border-color: #10b981 !important;
    }

    .skin-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .skin-rarity-tag {
      font-family: var(--font-arcade);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .skin-price-tag {
      font-family: var(--font-arcade);
      font-size: 0.85rem;
      font-weight: 800;
      color: #fbbf24;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .skin-card-title {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .skin-card-tagline {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .skin-card-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
    }

    .skin-status-badge {
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-equipped { color: #34d399; }
    .status-owned { color: #38bdf8; }
    .status-locked { color: #94a3b8; }

    /* ================================================================= */
    /* 3. HOLOGRAPHIC MODAL OVERLAYS */
    /* ================================================================= */
    .dino-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 10, 20, 0.88);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .dino-modal-box {
      background: linear-gradient(145deg, rgba(26, 36, 61, 0.96) 0%, rgba(15, 23, 42, 0.98) 100%);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 24px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.25), 0 25px 60px rgba(0, 0, 0, 0.9);
      animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    .modal-badge-row { margin-bottom: 12px; }

    .quiz-badge {
      font-family: var(--font-arcade);
      font-size: 0.82rem;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 999px;
      display: inline-block;
      letter-spacing: 1px;
    }

    .badge-diamond {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .badge-revive {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.6);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }

    .quiz-visual-frame {
      position: relative;
      margin-bottom: 14px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-height: 160px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .quiz-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .quiz-caption {
      background: rgba(10, 15, 28, 0.88);
      font-size: 0.78rem;
      color: #cbd5e1;
      padding: 5px 10px;
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
      font-style: italic;
    }

    .quiz-question-box h3 {
      font-family: var(--font-heading);
      font-size: 1.08rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .quiz-options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .quiz-option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 16px;
      color: #f1f5f9;
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .quiz-option-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: #38bdf8;
      transform: translateX(4px);
    }

    .quiz-option-btn .opt-key {
      background: rgba(255, 255, 255, 0.1);
      color: #38bdf8;
      border-radius: 8px;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-arcade);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .quiz-option-btn.correct {
      background: rgba(16, 185, 129, 0.3) !important;
      border-color: #10b981 !important;
      color: #6ee7b7 !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }

    .quiz-option-btn.wrong {
      background: rgba(239, 68, 68, 0.3) !important;
      border-color: #ef4444 !important;
      color: #fca5a5 !important;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .quiz-explanation-box {
      background: rgba(10, 15, 29, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      text-align: left;
    }

    .quiz-explanation-box p {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .btn-quiz-proceed {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-family: var(--font-arcade);
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }

    /* COLLISION MODAL */
    .collision-box {
      border-color: rgba(244, 63, 94, 0.5);
      box-shadow: 0 0 50px rgba(244, 63, 94, 0.3);
    }

    .collision-icon {
      font-size: 3rem;
      margin-bottom: 8px;
      animation: shakeIcon 0.5s ease-in-out;
    }

    @keyframes shakeIcon {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }

    .collision-title {
      font-family: var(--font-arcade);
      font-size: 1.35rem;
      font-weight: 900;
      color: #fb7185;
      margin-bottom: 8px;
    }

    .collision-desc {
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .collision-actions {
      display: flex;
      gap: 14px;
    }

    .btn-collision {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-family: var(--font-arcade);
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-give-up {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
    }

    .btn-give-up:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border-color: #ef4444;
    }

    .btn-try-more {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
      border-bottom: 4px solid #b45309;
    }

    .btn-try-more:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.7);
    }

    /* GAME OVER MODAL */
    .go-icon { font-size: 2.8rem; margin-bottom: 8px; }

    .go-title {
      font-family: var(--font-arcade);
      font-size: 1.45rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 16px;
    }

    .go-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .go-stat-card {
      background: rgba(10, 15, 29, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px;
    }

    .go-stat-card.highlight {
      grid-column: span 2;
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.15);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
    }

    .go-stat-val {
      font-family: var(--font-arcade);
      font-size: 1.3rem;
      font-weight: 900;
      color: #fff;
    }

    .go-stat-card.highlight .go-stat-val { color: #34d399; }

    .go-stat-lbl {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-go-restart {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-bottom: 4px solid #064e3b;
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font-family: var(--font-arcade);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    /* STAGE CLEAR MODAL */
    .clear-icon { font-size: 3rem; margin-bottom: 8px; }

    .clear-title {
      font-family: var(--font-arcade);
      font-size: 1.5rem;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .clear-desc {
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 20px;
    }

    .btn-start-next-stage {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: none;
      border-bottom: 4px solid #0369a1;
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font-family: var(--font-arcade);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }

    /* ================================================================= */
    /* 4. SLANG DICTIONARY (POKEDEX) & CRAWLER */
    /* ================================================================= */
    .dict-search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .dict-input {
      flex: 1;
      min-width: 240px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .dict-filter-btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
    }

    .dict-filter-btn.active {
      background: var(--primary-gradient);
      color: #fff;
      border-color: transparent;
    }

    .slang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .slang-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .slang-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .slang-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .slang-word {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }

    .slang-culture-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }

    .slang-phonetic {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .slang-intent {
      font-size: 0.92rem;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .slang-example-bubble {
      background: rgba(0, 0, 0, 0.35);
      border-left: 3px solid var(--primary);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
      font-style: italic;
    }

    .crawler-box {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    .crawler-icon { font-size: 3rem; margin-bottom: 12px; }

    .crawler-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .crawler-desc {
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto 24px;
      font-size: 0.95rem;
    }

    .btn-crawl {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-radius: 12px;
      padding: 16px 36px;
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }

    .btn-crawl:hover {
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.6);
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Root mount for React Application -->
  <div id="root"></div>

  <!-- Dino Slang Quest 2D Engine -->
  <script src="/static/dino_game.js"></script>

  <!-- React 18 Application Script (Babel Standalone) -->
  <script type="text/babel" src="/static/react_app.js"></script>
</body>
</html>
